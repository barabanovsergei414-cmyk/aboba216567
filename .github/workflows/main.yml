
name: Build PyroRealism

'on':
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip findutils

      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          ZIP_FILE="$(find . -type f -iname 'PyroRealism-NeoForge-1.21.1-Source-FIXED3.zip' -not -path './.git/*' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ZIP not found. Upload the source ZIP to this repository."
            find . -type f -iname '*.zip'
            exit 1
          fi
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP_FILE"

      - name: Extract source ZIP
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.source.outputs.zip }}" -d extracted
          PROJECT_FILE="$(find extracted -type f \( -name build.gradle -o -name build.gradle.kts \) -not -path '*/build/*' -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::No Gradle build file found inside ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Build mod
        run: gradle -p "$PROJECT_DIR" build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PyroRealism-NeoForge-1.21.1
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
